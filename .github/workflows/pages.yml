name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Ubuntu 26.04 lab image
        run: docker build -t ubuntu-bash-guide-lab .

      - name: Run every <!-- test --> example (fails the deploy if output drifts)
        run: docker run --rm -v "$PWD:/work" -w /work ubuntu-bash-guide-lab scripts/check-examples.sh

      - name: Generate screenshots from real output
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work ubuntu-bash-guide-lab scripts/make-screenshots.sh

      - name: Install mdBook
        env:
          MDBOOK_VERSION: "0.5.4"
        run: |
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo install -m 0755 mdbook /usr/local/bin/mdbook

      - name: Build the book
        run: mdbook build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
